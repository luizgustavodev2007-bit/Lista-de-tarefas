<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <main class="app-shell">
        <section class="todo-panel" aria-labelledby="app-title">
            <header class="app-header">
                <div>
                    <p class="eyebrow">Organizador pessoal</p>
                    <h1 id="app-title">Lista de tarefas</h1>
                </div>

                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">
                    <span class="theme-icon" aria-hidden="true"></span>
                </button>
            </header>

            <form class="task-form" id="taskForm">
                <label class="sr-only" for="taskInput">Nova tarefa</label>
                <input
                    id="taskInput"
                    type="text"
                    maxlength="80"
                    placeholder="Adicionar nova tarefa"
                    autocomplete="off"
                >
                <button type="submit">Adicionar</button>
            </form>

            <div class="toolbar" aria-label="Filtros da lista">
                <button class="filter-button active" type="button" data-filter="all">Todas</button>
                <button class="filter-button" type="button" data-filter="pending">Pendentes</button>
                <button class="filter-button" type="button" data-filter="completed">Concluídas</button>
            </div>

            <ul class="task-list" id="taskList" aria-live="polite"></ul>

            <div class="empty-state hidden" id="emptyState">
                <div class="empty-visual" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <p>Nenhuma tarefa para mostrar.</p>
            </div>

            <footer class="summary">
                <span id="totalTasks">0 tarefas</span>
                <span id="completedTasks">0 concluídas</span>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
